<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTT GTO Trainer - Ultimate Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121824;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #4ade80;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Layout Principal com Split Lateral */
        .app-layout {
            display: flex;
            gap: 25px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .trainer-container {
            background-color: #1e293b;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            flex: 1;
            max-width: 600px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Coluna da Direita (Matriz Ocultável) */
        .matrix-panel {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none; /* Começa oculto */
            flex-direction: column;
            align-items: center;
        }

        .matrix-title {
            font-size: 1.1rem;
            color: #4ade80;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .matrix {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 2px;
            width: 380px;
            height: 380px;
        }

        .cell {
            background-color: #334155;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: #ffffff;
            user-select: none;
        }

        /* Destaca a mão que o usuário recebeu no quiz */
        .cell-active-hand {
            outline: 2px solid #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
            z-index: 10;
        }

        .scenario-box {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .scenario-title {
            font-size: 1.1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scenario-details {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 0;
        }

        .hand-display {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fbbf24;
            background-color: #1e293b;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 6px;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 15px;
            height: 50px;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            min-width: 100px;
        }

        .btn-raise { background-color: #f97316; }
        .btn-raise:hover { background-color: #ea580c; }
        
        .btn-allin { background-color: #b91c1c; }
        .btn-allin:hover { background-color: #991b1b; }

        .btn-limp { background-color: #3b82f6; }
        .btn-limp:hover { background-color: #2563eb; }

        .btn-fold { background-color: #4b5563; }
        .btn-fold:hover { background-color: #374151; }

        /* Botão União Utilitário para Ver Gráfico */
        .btn-utility {
            background-color: #0284c7;
            color: white;
            padding: 10px 20px;
            font-size: 0.95rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-utility:hover { background-color: #0369a1; }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .score-highlight {
            color: #4ade80;
            font-weight: bold;
        }

        .feedback-box {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
            line-height: 1.4;
        }

        .feedback-correct {
            background-color: rgba(74, 222, 128, 0.2);
            color: #4ade80;
            border: 1px solid #4ade80;
        }

        .feedback-wrong {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .btn-restart {
            background-color: #10b981;
            padding: 12px 40px;
            font-size: 1.1rem;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>MTT GTO Quiz Trainer</h1>
    <p class="subtitle">Laboratório Avançado com Matriz do Solver Integrada</p>

    <!-- LAYOUT PRINCIPAL EM DUAS COLUNAS -->
    <div class="app-layout">
        
        <!-- COLUNA ESQUERDA: O JOGO DO TREINO -->
        <div class="trainer-container" id="gameContainer">
            
            <div class="feedback-box" id="feedbackBox">Feedback aqui</div>

            <div class="scenario-box">
                <div class="scenario-title" id="scenarioMeta">Carregando...</div>
                <div class="scenario-details">
                    Sua Mão: <br>
                    <div class="hand-display" id="currentHandDisplay">--</div>
                </div>
            </div>

            <div class="action-buttons">
                <button id="btnRaise" class="btn btn-raise" onclick="submitAction('raise')">Raise</button>
                <button id="btnAllin" class="btn btn-allin" onclick="submitAction('allin')">All-In</button>
                <button id="btnLimp" class="btn btn-limp" onclick="submitAction('limp')">Limp</button>
                <button id="btnFold" class="btn btn-fold" onclick="submitAction('fold')">Fold</button>
            </div>

            <!-- Botão de Alternância do Painel de Range -->
            <button class="btn-utility" onclick="toggleMatrixPanel()">Ver Matriz GTO deste Cenário</button>

            <div class="scoreboard">
                <div>Mão: <span id="currentHandNum" class="score-highlight">1</span> / 100</div>
                <div>Acertos: <span id="correctCount" class="score-highlight">0</span></div>
                <div>Aproveitamento: <span id="accuracyPercent" class="score-highlight">0%</span></div>
            </div>
        </div>

        <!-- COLUNA DIREITA: A MATRIZ DINÂMICA DO WIZARD -->
        <div class="matrix-panel" id="matrixPanel">
            <div class="matrix-title" id="matrixPanelTitle">Matriz de Range</div>
            <div class="matrix" id="pokerMatrix"></div>
        </div>

    </div>

        <button class="btn-restart" onclick="restartTrainer()">Treinar Novamente</button>
    </div>

            }
        };

        let totalHandsPlayed = 0;
        let correctAnswers = 0;
        let currentStack = "";
        let currentPosition = "";
        let currentHand = "";
        let correctGtoAction = "";
        let isPanelVisible = false; // Estado do painel lateral

        // FUNÇÃO: Cria a grade 13x13 na barra lateral (Roda apenas uma vez no início)
        function initMatrixGrid() {
            const matrixElement = document.getElementById('pokerMatrix');
            matrixElement.innerHTML = ''; 

            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 13; j++) {
                    let handName = "";
                    if (i < j) {
                        handName = cardValues[i] + cardValues[j] + "s";
                    } else if (i > j) {
                        handName = cardValues[j] + cardValues[i] + "o";
                    } else {
                        handName = cardValues[i] + cardValues[j];
                    }

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = handName;
                    cell.setAttribute('id', `grid-${handName}`);
                    matrixElement.appendChild(cell);
                }
            }
        }

        // FUNÇÃO: Pinta e atualiza as cores da matriz com base no cenário do Quiz
        function renderMatrixColors() {
            if (!isPanelVisible) return; // Economiza processamento se estiver fechado

            document.getElementById('matrixPanelTitle').innerText = `${currentPosition} (${currentStack})`;
            const positionData = gtoDatabase[currentStack][currentPosition];

            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 13; j++) {
                    let handName = "";
                    if (i < j) {
                        handName = cardValues[i] + cardValues[j] + "s";
                    } else if (i > j) {
                        handName = cardValues[j] + cardValues[i] + "o";
                    } else {
                        handName = cardValues[i] + cardValues[j];
                    }

                    const cell = document.getElementById(`grid-${handName}`);
                    const action = positionData.hands[handName];

                    // Remove classes antigas de destaque
                    cell.className = "cell";

                    // Destaca fisicamente a mão atual sorteada para o usuário jogar
                    if (handName === currentHand) {
                        cell.classList.add('cell-active-hand');
                    }

                    // Pinta de acordo com o GTO real mapeado
                    if (action === "raise") {
                        // Se o stack for curto, pinta o raise de vermelho escuro (allin)
                        cell.style.backgroundColor = (currentStack === "10BB" || currentStack === "15BB") ? "#b91c1c" : "#f97316"; 
                    } else if (action === "limp") {
                        cell.style.backgroundColor = "#3b82f6"; 
                    } else {
                        cell.style.backgroundColor = "#334155"; 
                    }
                }
            }
        }

        // FUNÇÃO: Liga/Desliga a exibição da coluna da direita
        function toggleMatrixPanel() {
            const panel = document.getElementById('matrixPanel');
            isPanelVisible = !isPanelVisible;

            if (isPanelVisible) {
                panel.style.display = "flex";
                renderMatrixColors(); // Força a pintura imediata
            } else {
                panel.style.display = "none";
            }
        }

        function generateNewScenario() {
            if (totalHandsPlayed >= 100) {
                endGame();
                return;
            }

            document.getElementById('currentHandNum').innerText = totalHandsPlayed + 1;

            currentStack = stacksList[Math.floor(Math.random() * stacksList.length)];
            currentPosition = positionsList[Math.floor(Math.random() * positionsList.length)];
            currentHand = allPossibleHands[Math.floor(Math.random() * allPossibleHands.length)];

            // Controle dinâmico visual dos botões
            if (currentStack === "10BB" || currentStack === "15BB") {
                document.getElementById('btnRaise').style.display = "none";
                document.getElementById('btnAllin').style.display = "inline-block";
                document.getElementById('btnLimp').style.display = "none";
            } else {
                document.getElementById('btnRaise').style.display = "inline-block";
                document.getElementById('btnAllin').style.display = "none";
                
                if (currentPosition === "SB") {
                    document.getElementById('btnLimp').style.display = "inline-block";
                } else {
                    document.getElementById('btnLimp').style.display = "none";
                }
            }

            const databaseTarget = gtoDatabase[currentStack][currentPosition].hands[currentHand];
            let basicAction = databaseTarget ? databaseTarget : "fold";

            if (basicAction === "raise" && (currentStack === "10BB" || currentStack === "15BB")) {
                correctGtoAction = "allin";
            } else {
                correctGtoAction = basicAction;
            }

            document.getElementById('scenarioMeta').innerText = `Stack: ${currentStack}  |  Posição: ${currentPosition} (Mesa em Gaps)`;
            document.getElementById('currentHandDisplay').innerText = currentHand;

            // Atualiza o desenho se o painel estiver aberto no momento da nova mão
            renderMatrixColors();
        }

        function submitAction(userAction) {
            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.style.display = "block";

            if (userAction === correctGtoAction) {
                correctAnswers++;
                feedbackBox.className = "feedback-box feedback-correct";
                feedbackBox.innerText = `Boa! Com ${currentHand} no ${currentPosition} (${currentStack}), a ação ideal é ${correctGtoAction.toUpperCase()}.`;
            } else {
                feedbackBox.className = "feedback-box feedback-wrong";
                feedbackBox.innerText = `Erro! Você escolheu ${userAction.toUpperCase()}. O GTO correto com ${currentHand} no ${currentPosition} (${currentStack}) é ${correctGtoAction.toUpperCase()}.`;
            }

            totalHandsPlayed++;

            const accuracy = Math.round((correctAnswers / totalHandsPlayed) * 100);
            document.getElementById('correctCount').innerText = correctAnswers;
            document.getElementById('accuracyPercent').innerText = `${accuracy}%`;

            generateNewScenario();
        }

        function endGame() {
            document.getElementById('gameContainer').style.display = "none";
            document.getElementById('matrixPanel').style.display = "none";
            const finalContainer = document.getElementById('summaryContainer');
            finalContainer.style.display = "block";

            const accuracy = Math.round((correctAnswers / 100) * 100);
            document.getElementById('finalAccuracy').innerText = `${accuracy}%`;

            const evalText = document.getElementById('evaluationText');
            if (accuracy >= 90) {
                evalText.innerText = "Excelente! Seu instinto GTO para ranges lineares e de push/fold está calibrado em nível profissional.";
            } else if (accuracy >= 75) {
                evalText.innerText = "Bom! Domínio aceitável, mas use a matriz lateral para identificar quais mãos marginais você está superestimando.";
            } else {
                evalText.innerText = "Precisa de ajustes urgentes. Mantenha a matriz aberta durante o treino para forçar sua mente a memorizar o desenho geométrico dos ranges.";
            }
        }

        function restartTrainer() {
            totalHandsPlayed = 0;
            correctAnswers = 0;
            isPanelVisible = false;
            document.getElementById('correctCount').innerText = "0";
            document.getElementById('accuracyPercent').innerText = "0%";
            document.getElementById('feedbackBox').style.display = "none";
            document.getElementById('summaryContainer').style.display = "none";
            document.getElementById('gameContainer').style.display = "block";
            generateNewScenario();
        }

        // Execuções Iniciais
        initMatrixGrid();
        generateNewScenario();
    </script>
