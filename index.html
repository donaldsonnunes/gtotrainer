<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTO Trainer</title>
    <style>
        body { margin: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        .table { width: 340px; height: 180px; background: #064e3b; border-radius: 100px; margin: 20px; border: 8px solid #334155; position: relative; }
        .card-container { display: flex; gap: 20px; margin: 20px; }
        .card { width: 80px; height: 110px; background: white; color: black; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 1.5rem; }
        .btn-group { display: flex; gap: 10px; width: 340px; }
        .btn { flex: 1; padding: 20px; border: none; font-weight: bold; color: white; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="stackText" style="margin-top: 10px; font-weight: bold;">Stack: --</div>
    <div class="table" id="table"></div>
    <div class="card-container" id="visualCards"></div>
    
    <div class="btn-group">
        <button class="btn" style="background: #f97316;" onclick="checkAction('raise')">RAISE</button>
        <button class="btn" style="background: #ef4444;" onclick="checkAction('fold')">FOLD</button>
        <button class="btn" style="background: #475569;" onclick="toggleMatrix()">MATRIZ</button>
    </div>
    <p id="feedback" style="margin: 20px; font-weight: bold;"></p>

    <script>
        // Lógica de Sorteio (Mantendo o que funcionava)
        const stacks = ["100bb", "60bb", "30bb", "20bb"];
        let db = {}, currentHand = "", currentPos = "";

        async function nextRound() {
            let stack = stacks[Math.floor(Math.random() * stacks.length)];
            const res = await fetch(`./${stack}.json?t=${Date.now()}`);
            db = await res.json();
            
            // Simulação de cartas (A, Q)
            currentHand = "AQ"; 
            document.getElementById('stackText').innerText = "Stack: " + stack.toUpperCase();
            renderCards();
        }

        function renderCards() {
            document.getElementById('visualCards').innerHTML = `
                <div class="card">A</div>
                <div class="card">Q</div>
            `;
        }

        function checkAction(a) { document.getElementById('feedback').innerText = "Ação: " + a; setTimeout(nextRound, 800); }
        function toggleMatrix() { alert("Matriz"); }

        window.onload = nextRound;
    </script>
</body>
</html>
