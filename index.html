<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTT GTO Quiz Trainer</title>
    
    <!-- CONEXÃO OBRIGATÓRIA PARA RECONHECER O INSTALADOR DO PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121824;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h1 {
            color: #4ade80;
            margin-bottom: 5px;
            font-size: 1.6rem;
            text-align: center;
        }

        p.subtitle {
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Layout Principal adaptável */
        .app-layout {
            display: flex;
            gap: 25px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .trainer-container {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            flex: 1;
            max-width: 550px;
            box-sizing: border-box;
            text-align: center;
        }

        /* PAINEL DA MATRIZ: Se adapta dinamicamente entre PC e Celular */
        .matrix-panel {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none; 
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .matrix-title {
            font-size: 1.1rem;
            color: #4ade80;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .matrix {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 2px;
            width: min(90vw, 380px);
            height: min(90vw, 380px);
        }

        .cell {
            background-color: #334155;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.55rem, 2.5vw, 0.65rem);
            font-weight: bold;
            color: #ffffff;
            user-select: none;
        }

        .cell-active-hand {
            outline: 2px solid #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
            z-index: 10;
        }

        .scenario-box {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .scenario-title {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scenario-details {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 0;
        }

        .hand-display {
            font-size: 2.3rem;
            font-weight: 800;
            color: #fbbf24;
            background-color: #1e293b;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 6px;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            height: 50px;
            align-items: center;
        }

        .btn {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            flex: 1;
            max-width: 120px;
        }

        .btn-raise { background-color: #f97316; }
        .btn-allin { background-color: #b91c1c; }
        .btn-limp { background-color: #3b82f6; }
        .btn-fold { background-color: #4b5563; }

        .btn-utility {
            background-color: #0284c7;
            color: white;
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
            width: 100%;
            max-width: 300px;
        }

        /* Botão para fechar a matriz no Celular */
        .btn-close-matrix {
            display: none;
            background-color: #ef4444;
            color: white;
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            width: 100%;
            max-width: 380px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .score-highlight { color: #4ade80; font-weight: bold; }

        .feedback-box {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .feedback-correct { background-color: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid #4ade80; }
        .feedback-wrong { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }

        /* REGRAS EXCLUSIVAS PARA CELULAR (EFEITO SLIDE LATERAL) */
        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
                align-items: center;
            }

            .matrix-panel {
                position: fixed;
                top: 0;
                right: -100%; /* Joga completamente para fora da tela na direita */
                width: 100vw;
                height: 100vh;
                z-index: 999;
                border-radius: 0;
                justify-content: center;
                transition: right 0.3s ease-in-out; /* Faz o efeito de deslizar suave */
            }

            /* Quando ativo, desliza para dentro da tela ocupando tudo */
            .matrix-panel.active {
                display: flex !important;
                right: 0;
            }

            .btn-close-matrix {
                display: block; /* Só aparece no celular */
            }
        }

        /* Se for computador, mantém o comportamento lado a lado padrão */
        @media (min-width: 769px) {
            .matrix-panel.active {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <h1>MTT GTO Quiz Trainer</h1>
    <p class="subtitle">Laboratório de Ranges Mobile-Ready</p>

    <div class="app-layout">
        
        <!-- PAINEL DA MESA/TREINO -->
        <div class="trainer-container" id="gameContainer">
            <div class="feedback-box" id="feedbackBox">Feedback aqui</div>

            <div class="scenario-box">
                <div class="scenario-title" id="scenarioMeta">Carregando...</div>
                <div class="scenario-details">
                    Sua Mão: <br>
                    <div class="hand-display" id="currentHandDisplay">--</div>
                </div>
            </div>

            <div class="action-buttons">
                <button id="btnRaise" class="btn btn-raise" onclick="submitAction('raise')">Raise</button>
                <button id="btnAllin" class="btn btn-allin" onclick="submitAction('allin')">All-In</button>
                <button id="btnLimp" class="btn btn-limp" onclick="submitAction('limp')">Limp</button>
                <button id="btnFold" class="btn btn-fold" onclick="submitAction('fold')">Fold</button>
            </div>

            <button class="btn-utility" onclick="openMatrixPanel()">Ver Matriz GTO deste Cenário</button>

            <div class="scoreboard">
                <div>Mão: <span id="currentHandNum" class="score-highlight">1</span> / 100</div>
                <div>Acertos: <span id="correctCount" class="score-highlight">0</span></div>
                <div>Aproveitamento: <span id="accuracyPercent" class="score-highlight">0%</span></div>
            </div>
        </div>

        <!-- PAINEL DA MATRIZ (DRAWER SLIDE MOBILE) -->
        <div class="matrix-panel" id="matrixPanel">
            <div class="matrix-title" id="matrixPanelTitle">Matriz de Range</div>
            <div class="matrix" id="pokerMatrix"></div>
            <button class="btn-close-matrix" onclick="closeMatrixPanel()">← Voltar para o Treino</button>
        </div>

    </div>

    <div class="trainer-container" id="summaryContainer" style="display: none; margin-top: 20px;">
        <h2>Treino Concluído!</h2>
        <p>Seu aproveitamento médio foi de:</p>
        <div style="font-size: 3.5rem; font-weight: 900; color: #4ade80; margin: 15px 0;" id="finalAccuracy">0%</div>
        <p id="evaluationText" style="color: #94a3b8; margin-bottom: 20px;"></p>
        <button style="background-color: #10b981; padding: 12px 40px; color:white; border:none; border-radius:6px; font-weight:bold;" onclick="restartTrainer()">Treinar Novamente</button>
    </div>

        let totalHandsPlayed = 0;
        let correctAnswers = 0;
        let currentStack = "";
        let currentPosition = "";
        let currentHand = "";
        let correctGtoAction = "";
        let isPanelVisible = false;

        function initMatrixGrid() {
            const matrixElement = document.getElementById('pokerMatrix');
            matrixElement.innerHTML = ''; 

            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 13; j++) {
                    let handName = "";
                    if (i < j) {
                        handName = cardValues[i] + cardValues[j] + "s";
                    } else if (i > j) {
                        handName = cardValues[j] + cardValues[i] + "o";
                    } else {
                        handName = cardValues[i] + cardValues[j];
                    }

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = handName;
                    cell.setAttribute('id', `grid-${handName}`);
                    matrixElement.appendChild(cell);
                }
            }
        }

        function renderMatrixColors() {
            if (!isPanelVisible) return; 

            document.getElementById('matrixPanelTitle').innerText = `${currentPosition} (${currentStack})`;
            const positionData = gtoDatabase[currentStack][currentPosition];

            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 13; j++) {
                    let handName = "";
                    if (i < j) {
                        handName = cardValues[i] + cardValues[j] + "s";
                    } else if (i > j) {
                        handName = cardValues[j] + cardValues[i] + "o";
                    } else {
                        handName = cardValues[i] + cardValues[j];
                    }

                    const cell = document.getElementById(`grid-${handName}`);
                    const action = positionData.hands[handName];

                    cell.className = "cell";

                    if (handName === currentHand) {
                        cell.classList.add('cell-active-hand');
                    }

                    if (action === "raise") {
                        cell.style.backgroundColor = (currentStack === "10BB" || currentStack === "15BB") ? "#b91c1c" : "#f97316"; 
                    } else if (action === "limp") {
                        cell.style.backgroundColor = "#3b82f6"; 
                    } else {
                        cell.style.backgroundColor = "#334155"; 
                    }
                }
            }
        }

        // DISPARADORES VISUAIS REVISADOS PARA CELULAR E PC
        function openMatrixPanel() {
            const panel = document.getElementById('matrixPanel');
            isPanelVisible = true;
            panel.classList.add('active'); // Ativa classe CSS com efeito Slide
            renderMatrixColors();
        }

        function closeMatrixPanel() {
            const panel = document.getElementById('matrixPanel');
            isPanelVisible = false;
            panel.classList.remove('active'); // Recolhe o painel para fora da tela
        }

        function generateNewScenario() {
            if (totalHandsPlayed >= 100) {
                endGame();
                return;
            }

            document.getElementById('currentHandNum').innerText = totalHandsPlayed + 1;

            currentStack = stacksList[Math.floor(Math.random() * stacksList.length)];
            currentPosition = positionsList[Math.floor(Math.random() * positionsList.length)];
            currentHand = allPossibleHands[Math.floor(Math.random() * allPossibleHands.length)];

            if (currentStack === "10BB" || currentStack === "15BB") {
                document.getElementById('btnRaise').style.display = "none";
                document.getElementById('btnAllin').style.display = "inline-block";
                document.getElementById('btnLimp').style.display = "none";
            } else {
                document.getElementById('btnRaise').style.display = "inline-block";
                document.getElementById('btnAllin').style.display = "none";
                
                if (currentPosition === "SB") {
                    document.getElementById('btnLimp').style.display = "inline-block";
                } else {
                    document.getElementById('btnLimp').style.display = "none";
                }
            }

            const databaseTarget = gtoDatabase[currentStack][currentPosition].hands[currentHand];
            let basicAction = databaseTarget ? databaseTarget : "fold";

            if (basicAction === "raise" && (currentStack === "10BB" || currentStack === "15BB")) {
                correctGtoAction = "allin";
            } else {
                correctGtoAction = basicAction;
            }

            document.getElementById('scenarioMeta').innerText = `Stack: ${currentStack}  |  Posição: ${currentPosition}`;
            document.getElementById('currentHandDisplay').innerText = currentHand;

            renderMatrixColors();
        }

        function submitAction(userAction) {
            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.style.display = "block";

            if (userAction === correctGtoAction) {
                correctAnswers++;
                feedbackBox.className = "feedback-box feedback-correct";
                feedbackBox.innerText = `Boa! Com ${currentHand} no ${currentPosition} (${currentStack}), o correto é ${correctGtoAction.toUpperCase()}.`;
            } else {
                feedbackBox.className = "feedback-box feedback-wrong";
                feedbackBox.innerText = `Erro! GTO ideal com ${currentHand} no ${currentPosition} (${currentStack}) é ${correctGtoAction.toUpperCase()}.`;
            }

            totalHandsPlayed++;

            const accuracy = Math.round((correctAnswers / totalHandsPlayed) * 100);
            document.getElementById('correctCount').innerText = correctAnswers;
            document.getElementById('accuracyPercent').innerText = `${accuracy}%`;

            generateNewScenario();
        }

        function endGame() {
            document.getElementById('gameContainer').style.display = "none";
            document.getElementById('matrixPanel').classList.remove('active');
            const finalContainer = document.getElementById('summaryContainer');
            finalContainer.style.display = "block";

            const accuracy = Math.round((correctAnswers / 100) * 100);
            document.getElementById('finalAccuracy').innerText = `${accuracy}%`;

            const evalText = document.getElementById('evaluationText');
            if (accuracy >= 90) {
                evalText.innerText = "Excelente! Seu entendimento de RFI e push/fold está calibrado em nível profissional.";
            } else if (accuracy >= 75) {
                evalText.innerText = "Muito bom! Falta apenas ajustar pequenos detalhes matemáticos em potes marginais.";
            } else {
                evalText.innerText = "Abaixo da média. Pratique mais mantendo o gráfico de apoio aberto para fixar a geometria dos ranges.";
            }
        }

        function restartTrainer() {
            totalHandsPlayed = 0;
            correctAnswers = 0;
            isPanelVisible = false;
            document.getElementById('correctCount').innerText = "0";
            document.getElementById('accuracyPercent').innerText = "0%";
            document.getElementById('feedbackBox').style.display = "none";
            document.getElementById('summaryContainer').style.display = "none";
            document.getElementById('gameContainer').style.display = "block";
            generateNewScenario();
        }

        initMatrixGrid();
        generateNewScenario();
    </script>
