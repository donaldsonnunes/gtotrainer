<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz GTO Pro</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; width: 100%; max-width: 400px; }
        .matrix { display: grid; grid-template-columns: repeat(13, 1fr); gap: 1px; width: 100%; max-width: 400px; margin-top: 20px; }
        .cell { background-color: #334155; padding: 4px 1px; text-align: center; font-size: 8px; border-radius: 1px; color: #94a3b8; }
        .raise { background-color: #f97316 !important; color: white !important; font-weight: bold; }
        .fold { background-color: #1e293b !important; color: #475569 !important; }
        button { padding: 15px 30px; font-size: 16px; margin: 5px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-raise { background: #f97316; color: white; }
        .btn-fold { background: #4b5563; color: white; }
    </style>
</head>
<body>
    <div class="box">
        <p>Stack: <span id="stack">--</span> | Pos: <span id="pos">--</span></p>
        <p>Mão: <strong id="hand" style="font-size: 2rem;">--</strong></p>
        <button class="btn-raise" onclick="check('raise')">Raise</button>
        <button class="btn-fold" onclick="check('fold')">Fold</button>
        <p id="result" style="height:20px;"></p>
    </div>
    <div id="matrix" class="matrix"></div>

    <script>
        const cardValues = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
        const stacks = ["100bb", "60bb", "30bb", "20bb"];
        let db = {};

        // Gera todas as 169 mãos possíveis
        function getAllHands() {
            let hands = [];
            for(let i=0; i<13; i++){
                for(let j=0; j<13; j++){
                    hands.push((i<j) ? cardValues[i]+cardValues[j]+"s" : (i>j) ? cardValues[j]+cardValues[i]+"o" : cardValues[i]+cardValues[j]);
                }
            }
            return hands;
        }

        async function nextRound() {
            // 1. Sorteia a mão primeiro (qualquer uma do baralho)
            const allHands = getAllHands();
            let hand = allHands[Math.floor(Math.random() * allHands.length)];
            
            // 2. Sorteia Stack e Posição
            let stack = stacks[Math.floor(Math.random() * stacks.length)];
            try {
                const res = await fetch('./' + stack + '.json');
                db = await res.json();
                
                const positions = Object.keys(db);
                let pos = positions[Math.floor(Math.random() * positions.length)];
                
                // 3. Atualiza interface
                document.getElementById('stack').innerText = stack.toUpperCase();
                document.getElementById('pos').innerText = pos;
                document.getElementById('hand').innerText = hand;
                document.getElementById('result').innerText = "";
                
                renderMatrix(pos);
            } catch(e) { console.error("Erro ao carregar"); }
        }

        function renderMatrix(pos) {
            const m = document.getElementById('matrix');
            m.innerHTML = '';
            const allHands = getAllHands();
            
            allHands.forEach(hand => {
                let div = document.createElement('div');
                div.className = 'cell';
                div.innerText = hand;
                let action = (db[pos].hands[hand] || "fold").toLowerCase();
                div.classList.add(action === "raise" ? 'raise' : 'fold');
                m.appendChild(div);
            });
        }

        function check(action) {
            let pos = document.getElementById('pos').innerText;
            let hand = document.getElementById('hand').innerText;
            let correct = (db[pos].hands[hand] || "fold").toLowerCase();
            
            document.getElementById('result').innerText = (action === correct) ? "✅ Acertou!" : "❌ Errou: " + correct.toUpperCase();
            setTimeout(nextRound, 1200);
        }

        nextRound();
    </script>
</body>
</html>
