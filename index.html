<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro GTO Trainer</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .stack-badge { background: #f97316; padding: 5px 15px; border-radius: 8px; font-weight: bold; }
        
        .table { width: 95%; max-width: 400px; height: 220px; background: #064e3b; border-radius: 120px; margin: 15px 0; border: 8px solid #334155; position: relative; }
        .seat { position: absolute; background: #1e293b; padding: 4px 8px; border-radius: 4px; font-size: 10px; border: 1px solid #475569; color: #94a3b8; }
        .active-seat { border: 1px solid #f97316; color: #f97316; font-weight: bold; background: #334155; }
        .dealer-btn { position: absolute; width: 22px; height: 22px; background: white; color: black; border-radius: 50%; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 10; border: 1px solid #000; }

        /* Cartas Maiores */
        .hand-container { display: flex; gap: 20px; margin: 20px 0; }
        .card { width: 85px; height: 120px; background: white; color: black; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px; font-weight: bold; font-size: 1.8rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .suit-big { font-size: 3.5rem; margin-top: -10px; }
        .red { color: #dc2626; }
        .black { color: #1e293b; }
        
        .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; }
        button { padding: 16px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 0.9rem; color: #94a3b8;">Mãos: <span id="count">0</span>/100 | Acerto: <span id="perc">0</span>%</div>
        <div class="stack-badge" id="stackText">--</div>
    </div>

    <div class="table" id="table">
        <div class="seat" style="top:10px; left:42%;" id="s-UTG">UTG</div>
        <div class="seat" style="top:40px; right:15%;" id="s-UTG1">UTG1</div>
        <div class="seat" style="bottom:80px; right:5%;" id="s-UTG2">UTG2</div>
        <div class="seat" style="bottom:40px; right:15%;" id="s-MP">MP</div>
        <div class="seat" style="bottom:10px; left:42%;" id="s-HJ">HJ</div>
        <div class="seat" style="bottom:40px; left:15%;" id="s-CO">CO</div>
        <div class="seat" style="bottom:80px; left:5%;" id="s-BTN">BTN</div>
        <div class="seat" style="top:40px; left:15%;" id="s-SB">SB</div>
        <div class="seat" style="top:10px; left:42%;" id="s-BB">BB</div>
        <div id="dealerBtn" class="dealer-btn">D</div>
    </div>

    <div class="hand-container" id="visualCards"></div>
    
    <div class="actions">
        <button style="background: #f97316;" onclick="checkAction('raise')">RAISE</button>
        <button style="background: #ef4444;" onclick="checkAction('fold')">FOLD</button>
        <button style="background: #64748b;" onclick="toggleMatrix()">MATRIZ</button>
    </div>
    <p id="feedback" style="font-weight:bold; height:25px; margin-top: 15px;"></p>

    <script>
        const cardValues = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
        const suits = [{s:'♠',c:'black'},{s:'♣',c:'black'},{s:'♥',c:'red'},{s:'♦',c:'red'}];
        const stacks = ["100bb", "60bb", "30bb", "20bb"];
        let db = {}, handPool = [], handsCount = 0, hits = 0, currentHand = "", currentPos = "";

        function shuffleHands() {
            let h = [];
            for(let i=0; i<13; i++) for(let j=0; j<13; j++) h.push((i<j)?cardValues[i]+cardValues[j]+"s":(i>j)?cardValues[j]+cardValues[i]+"o":cardValues[i]+cardValues[j]);
            return h.sort(() => Math.random() - 0.5);
        }

        async function nextRound() {
            if(handsCount >= 100) { alert("Treino Finalizado!"); handsCount=0; hits=0; }
            if(handPool.length === 0) handPool = shuffleHands();
            currentHand = handPool.pop();
            let stack = stacks[Math.floor(Math.random() * stacks.length)];
            
            try {
                const res = await fetch(`./${stack}.json?t=${new Date().getTime()}`);
                db = await res.json();
                let positions = Object.keys(db);
                currentPos = positions[Math.floor(Math.random() * positions.length)];
                
                document.getElementById('stackText').innerText = stack.toUpperCase();
                document.querySelectorAll('.seat').forEach(s => s.classList.remove('active-seat'));
                document.getElementById('s-'+currentPos).classList.add('active-seat');
                
                const btn = document.getElementById('s-BTN');
                document.getElementById('dealerBtn').style.cssText = `top:${btn.offsetTop+10}px; left:${btn.offsetLeft+10}px;`;
                
                renderCards();
            } catch(e) { document.getElementById('feedback').innerText = "Erro ao carregar JSON!"; }
        }

        function renderCards() {
            const v1 = currentHand[0], v2 = currentHand[1], type = currentHand[2] || "";
            let s1 = suits[Math.floor(Math.random()*4)], s2 = (type === 's') ? s1 : suits.find(x => x.s !== s1.s);
            document.getElementById('visualCards').innerHTML = `
                <div class="card ${s1.c}"><div>${v1}</div><div class="suit-big">${s1.s}</div></div>
                <div class="card ${s2.c}"><div>${v2}</div><div class="suit-big">${s2.s}</div></div>
            `;
        }

        function checkAction(action) {
            handsCount++;
            let correct = (db[currentPos].hands[currentHand] || "fold").toLowerCase();
            if(action === correct) { hits++; document.getElementById('feedback').innerText = "✅ ACERTOU!"; }
            else document.getElementById('feedback').innerText = "❌ ERROU: " + correct.toUpperCase();
            
            document.getElementById('count').innerText = handsCount;
            document.getElementById('perc').innerText = Math.round((hits/handsCount)*100);
            setTimeout(nextRound, 800);
        }

        function toggleMatrix() { /* Lógica da Matriz aqui */ alert("Matriz aberta"); }
        
        window.onload = nextRound;
    </script>
</body>
</html>
