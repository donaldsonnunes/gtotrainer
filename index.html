<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quiz GTO</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 8px; text-align: center; width: 300px; }
        .matrix { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; width: 360px; margin-top: 20px; }
        .cell { background-color: #334155; padding: 5px; text-align: center; font-size: 9px; border-radius: 2px; }
        button { padding: 10px 20px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <p>Stack: <span id="stack">--</span> | Pos: <span id="pos">--</span></p>
        <p>Mão: <strong id="hand">--</strong></p>
        <button onclick="check('raise')">Raise</button>
        <button onclick="check('fold')">Fold</button>
        <p id="result"></p>
    </div>
    <div id="matrix" class="matrix"></div>

    <script>
        const cardValues = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
        let db = {};
        let currentPos = "", currentHand = "", currentStack = "";

        async function init() {
            try {
                const res = await fetch('./100bb.json');
                db = await res.json();
                renderMatrix();
                next();
            } catch(e) { console.error("Erro JSON"); }
        }

        function renderMatrix() {
            const m = document.getElementById('matrix');
            m.innerHTML = '';
            for(let i=0; i<13; i++){
                for(let j=0; j<13; j++){
                    let hand = (i<j) ? cardValues[i]+cardValues[j]+"s" : (i>j) ? cardValues[j]+cardValues[i]+"o" : cardValues[i]+cardValues[j];
                    let div = document.createElement('div');
                    div.className = 'cell';
                    div.innerText = hand;
                    // Lógica de cores: busca direto no .hands do JSON
                    let action = (db[currentPos] && db[currentPos].hands && db[currentPos].hands[hand]) ? db[currentPos].hands[hand] : "fold";
                    div.style.background = (action.toLowerCase() === "raise") ? "#f97316" : "#334155";
                    m.appendChild(div);
                }
            }
        }

        function next() {
            currentPos = "UTG"; // Ajuste conforme necessário
            const hands = Object.keys(db[currentPos].hands);
            currentHand = hands[Math.floor(Math.random() * hands.length)];
            document.getElementById('hand').innerText = currentHand;
            document.getElementById('pos').innerText = currentPos;
            document.getElementById('stack').innerText = "100BB";
        }

        function check(action) {
            let correct = db[currentPos].hands[currentHand].toLowerCase();
            document.getElementById('result').innerText = (action === correct) ? "✅ Acertou!" : "❌ Errou: " + correct;
            renderMatrix();
            setTimeout(next, 1000);
        }
        init();
    </script>
</body>
</html>
