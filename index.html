<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro GTO Trainer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        
        /* MESA E ASSENTOS CORRIGIDOS */
        .table { width: 340px; height: 200px; background: #064e3b; border-radius: 120px; margin: 20px 0; border: 10px solid #1e293b; position: relative; }
        .seat { position: absolute; background: #1e293b; padding: 3px 6px; border-radius: 4px; font-size: 9px; border: 1px solid #475569; color: #94a3b8; }
        .dealer-btn { position: absolute; width: 20px; height: 20px; background: white; color: black; border-radius: 50%; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 2px solid #000; }
        .active-seat { border-color: #f97316; color: #f97316; font-weight: bold; }

        /* CARTAS REAIS */
        .hand-display { display: flex; gap: 10px; margin: 20px 0; }
        .card { width: 60px; height: 85px; background: white; color: black; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px; font-weight: bold; font-size: 1.1rem; }
        .suit-big { font-size: 2.5rem; margin-top: -5px; }
        .red { color: #dc2626; }
        .black { color: #1e293b; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 350px; }
        button { padding: 14px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <p>Stack: <span id="stackText">--</span></p>
    <div class="table" id="table">
        <div class="seat" style="top:5px; left:43%;" id="s-BB">BB</div>
        <div class="seat" style="top:35px; left:15%;" id="s-SB">SB</div>
        <div class="seat" style="top:85px; left:5%;" id="s-BTN">BTN</div>
        <div class="seat" style="bottom:35px; left:15%;" id="s-CO">CO</div>
        <div class="seat" style="bottom:5px; left:43%;" id="s-HJ">HJ</div>
        <div class="seat" style="bottom:35px; right:15%;" id="s-MP">MP</div>
        <div class="seat" style="top:85px; right:5%;" id="s-UTG2">UTG2</div>
        <div class="seat" style="top:35px; right:15%;" id="s-UTG1">UTG1</div>
        <div class="seat" style="top:5px; right:43%;" id="s-UTG">UTG</div>
        <div id="dealerBtn" class="dealer-btn">D</div>
    </div>

    <div class="hand-display" id="visualCards"></div>
    <div class="actions">
        <button style="background:#f97316; color:white;" onclick="checkAction('raise')">RAISE</button>
        <button style="background:#475569; color:white;" onclick="checkAction('fold')">FOLD</button>
        <button style="grid-column: span 2; background:#334155; color:white;" onclick="toggleMatrix()">VER MATRIZ</button>
    </div>
    <p id="feedback" style="height:20px; font-weight:bold; margin-top:15px;"></p>

    <script>
        const cardValues = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
        const suits = [{s:'♠',c:'black'},{s:'♣',c:'black'},{s:'♥',c:'red'},{s:'♦',c:'red'}];
        const stacks = ["100bb", "60bb", "30bb", "20bb"];
        const posList = ["UTG", "UTG1", "UTG2", "MP", "HJ", "CO", "BTN", "SB", "BB"];
        
        let db = {}, handPool = [], currentHand = "", currentPos = "", currentStack = "";

        // Gera baralho e embaralha (evita repetições)
        function shuffleHands() {
            let h = [];
            for(let i=0; i<13; i++) for(let j=0; j<13; j++) 
                h.push((i<j)?cardValues[i]+cardValues[j]+"s":(i>j)?cardValues[j]+cardValues[i]+"o":cardValues[i]+cardValues[j]);
            return h.sort(() => Math.random() - 0.5);
        }

        async function nextRound() {
            if(handPool.length === 0) handPool = shuffleHands();
            currentHand = handPool.pop();
            currentStack = stacks[Math.floor(Math.random() * stacks.length)];
            
            const res = await fetch(`./${currentStack}.json`);
            db = await res.json();
            currentPos = posList[Math.floor(Math.random() * posList.length)];
            
            // Posiciona Dealer (D)
            const seat = document.getElementById('s-'+currentPos);
            const dealer = document.getElementById('dealerBtn');
            dealer.style.top = (seat.offsetTop + 15) + 'px';
            dealer.style.left = (seat.offsetLeft + 15) + 'px';

            document.getElementById('stackText').innerText = currentStack.toUpperCase();
            document.querySelectorAll('.seat').forEach(s => s.classList.remove('active-seat'));
            seat.classList.add('active-seat');
            
            renderCards();
        }

        function renderCards() {
            const v1 = currentHand[0], v2 = currentHand[1], type = currentHand[2] || "";
            let s1 = suits[Math.floor(Math.random()*4)], s2 = (type === 's') ? s1 : suits.find(x => x.s !== s1.s);
            document.getElementById('visualCards').innerHTML = `
                <div class="card ${s1.c}"><div>${v1}</div><div class="suit-big">${s1.s}</div></div>
                <div class="card ${s2.c}"><div>${v2}</div><div class="suit-big">${s2.s}</div></div>
            `;
        }

        function checkAction(action) {
            let correct = (db[currentPos]?.hands?.[currentHand] || "fold").toLowerCase();
            document.getElementById('feedback').innerText = (action === correct) ? "✅ ACERTOU!" : "❌ ERROU: " + correct.toUpperCase();
            setTimeout(nextRound, 1000);
        }

        nextRound();
    </script>
</body>
</html>
