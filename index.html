<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTO Trainer Pro</title>
    <style>
        :root { --bg-color: #0f172a; --table-color: #064e3b; --raise-color: #f97316; --fold-color: #ef4444; }
        
        /* Reset para ocupar a largura total do ecrã */
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-color); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh;
        }
        
        /* Containers responsivos (usando %) */
        .header-top { width: 100%; max-width: 500px; display: flex; justify-content: space-between; margin-bottom: 15px; }
        .stack-box { background: #d97706; padding: 6px 15px; border-radius: 6px; font-weight: 800; font-size: 1rem; }
        
        .table { width: 100%; max-width: 500px; aspect-ratio: 2 / 1; background: var(--table-color); border-radius: 50%; margin: 20px 0; border: 10px solid #334155; position: relative; }
        
        /* Aumentei a fonte dos assentos */
        .seat { position: absolute; background: #1e293b; padding: 5px 10px; border-radius: 5px; font-size: 12px; border: 1px solid #475569; color: #94a3b8; }
        
        /* Cartas maiores e fluidas */
        .hand-container { display: flex; gap: 20px; margin: 30px 0; }
        .card { width: 22vw; max-width: 100px; height: 30vw; max-height: 140px; background: white; color: black; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px; font-weight: 700; font-size: 1.8rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .suit-big { font-size: 4rem; }
        
        /* Botões robustos */
        .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; max-width: 500px; }
        .btn-ui { padding: 20px 0; border: none; font-weight: 800; cursor: pointer; border-radius: 8px; font-size: 1.1rem; }
    </style>
