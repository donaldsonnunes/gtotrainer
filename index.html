<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GTO Trainer Pro</title>
    <style>
        :root { --bg-color: #0f172a; --table-color: #064e3b; --raise-color: #f97316; --fold-color: #ef4444; }
        body { font-family: sans-serif; background: var(--bg-color); color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        
        .header-top { width: 100%; max-width: 350px; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .stack-box { background: #d97706; padding: 4px 12px; border-radius: 4px; font-weight: 800; font-size: 0.9rem; }
        
        .table { width: 340px; height: 180px; background: var(--table-color); border-radius: 100px; margin: 15px 0; border: 8px solid #334155; position: relative; }
        .seat { position: absolute; background: #1e293b; padding: 2px 6px; border-radius: 3px; font-size: 8px; border: 1px solid #475569; color: #94a3b8; }
        .active-seat { border: 1px solid var(--raise-color); color: white; background: #374151; }

        /* Cartas Garantidas */
        #visualCards { display: flex; gap: 15px; margin: 20px 0; min-height: 100px; }
        .card { width: 70px; height: 100px; background: white; color: black; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px; font-weight: 700; font-size: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .suit-big { font-size: 3rem; margin-top: -10px; }
        .red { color: #dc2626; }
        .black { color: #1e293b; }

        .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; max-width: 350px; }
        .btn-ui { padding: 14px 0; border: none; font-weight: 700; cursor: pointer; border-radius: 4px; font-size: 0.9rem; }
        .btn-raise { background: var(--raise-color); color: white; }
        .btn-fold { background: var(--fold-color); color: white; }
        .btn-matrix { background: #475569; color: white; }
        #feedback { font-weight: 700; height: 25px; margin-top: 15px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header-top">
        <div style="color: #94a3b8; font-size: 0.85rem;">Mãos: <span id="count">0</span>/100 | Acerto: <span id="perc">0</span>%</div>
        <div class="stack-box" id="stackText">--</div>
    </div>

    <div class="table" id="table">
        <div class="seat" style="top:5px; left:45%;" id="s-UTG">UTG</div>
        <div class="seat" style="top:30px; right:20%;" id="s-UTG1">UTG1</div>
        <div class="seat" style="top:80px; right:5%;" id="s-UTG2">UTG2</div>
        <div class="seat" style="bottom:30px; right:20%;" id="s-MP">MP</div>
        <div class="seat" style="bottom:5px; left:45%;" id="s-HJ">HJ</div>
        <div class="seat" style="bottom:30px; left:20%;" id="s-CO">CO</div>
        <div class="seat" style="top:80px; left:5%;" id="s-BTN">BTN</div>
        <div class="seat" style="top:30px; left:20%;" id="s-SB">SB</div>
        <div class="seat" style="top:5px; left:45%;" id="s-BB">BB</div>
    </div>

    <div id="visualCards"></div>
    
    <div class="actions">
        <button class="btn-ui btn-raise" onclick="checkAction('raise')">RAISE</button>
        <button class="btn-ui btn-fold" onclick="checkAction('fold')">FOLD</button>
        <button class="btn-ui btn-matrix" onclick="toggleMatrix()">MATRIZ</button>
    </div>
    <p id="feedback"></p>

    <script>
        const cardValues = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
        const suits = [{s:'♠',c:'black'},{s:'♣',c:'black'},{s:'♥',c:'red'},{s:'♦',c:'red'}];
        const stacks = ["100bb", "60bb", "30bb", "20bb"];
        let db = {}, handPool = [], handsCount = 0, hits = 0, currentHand = "", currentPos = "";

        function shuffleHands() {
            let h = [];
            for(let i=0; i<13; i++) for(let j=0; j<13; j++) h.push((i<j)?cardValues[i]+cardValues[j]+"s":(i>j)?cardValues[j]+cardValues[i]+"o":cardValues[i]+cardValues[j]);
            return h.sort(() => Math.random() - 0.5);
        }

        async function nextRound() {
            if(handPool.length === 0) handPool = shuffleHands();
            currentHand = handPool.pop();
            let currentStack = stacks[Math.floor(Math.random() * stacks.length)];
            
            const res = await fetch(`./${currentStack}.json?t=${new Date().getTime()}`);
            db = await res.json();
            currentPos = Object.keys(db)[Math.floor(Math.random() * Object.keys(db).length)];
            
            document.getElementById('stackText').innerText = currentStack.toUpperCase();
            document.querySelectorAll('.seat').forEach(s => s.classList.remove('active-seat'));
            document.getElementById('s-'+currentPos).classList.add('active-seat');
            
            renderCards();
        }

        function renderCards() {
            const v1 = currentHand[0], v2 = currentHand[1], type = currentHand[2] || "";
            let s1 = suits[Math.floor(Math.random()*4)], s2 = (type === 's') ? s1 : suits.find(x => x.s !== s1.s);
            document.getElementById('visualCards').innerHTML = `
                <div class="card ${s1.c}"><div>${v1}</div><div class="suit-big">${s1.s}</div></div>
                <div class="card ${s2.c}"><div>${v2}</div><div class="suit-big">${s2.s}</div></div>
            `;
        }

        function checkAction(action) {
            handsCount++;
            let correct = (db[currentPos]?.hands[currentHand] || "fold").toLowerCase();
            if(action === correct) { hits++; document.getElementById('feedback').innerText = "✅ ACERTOU!"; }
            else document.getElementById('feedback').innerText = "❌ ERROU: " + correct.toUpperCase();
            
            document.getElementById('count').innerText = handsCount;
            document.getElementById('perc').innerText = handsCount > 0 ? Math.round((hits/handsCount)*100) : 0;
            setTimeout(nextRound, 800);
        }

        function toggleMatrix() { alert("Matriz em manutenção..."); }
        window.onload = nextRound;
    </script>
</body>
</html>
