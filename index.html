<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MTT GTO Quiz</title>
    <style>
        /* CSS FORTE para não ser sobrescrito */
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 8px; text-align: center; width: 100%; max-width: 400px; margin-bottom: 20px; }
        .matrix { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; width: 100%; max-width: 400px; }
        .cell { background-color: #334155; padding: 4px; text-align: center; font-size: 8px; border-radius: 2px; color: #cbd5e1; }
        .raise { background-color: #f97316 !important; color: white; }
        button { padding: 15px 30px; cursor: pointer; margin: 5px; font-size: 16px; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <div class="box">
        <p>Stack: <span id="stack">--</span> | Pos: <span id="pos">--</span></p>
        <p>Mão: <strong id="hand" style="font-size: 24px;">--</strong></p>
        <button onclick="check('raise')">Raise</button>
        <button onclick="check('fold')">Fold</button>
        <p id="result"></p>
    </div>
    <div id="matrix" class="matrix"></div>

    <script>
        const cardValues = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
        const stacks = ["100bb", "60bb", "30bb", "20bb"];
        let db = {};

        async function loadGame() {
            let nextStack = stacks[Math.floor(Math.random() * stacks.length)];
            try {
                const res = await fetch('./' + nextStack + '.json');
                db = await res.json();
                document.getElementById('stack').innerText = nextStack.toUpperCase();
                next(nextStack);
            } catch(e) { console.error("Erro ao carregar"); }
        }

        function next(stack) {
            const positions = Object.keys(db);
            let pos = positions[Math.floor(Math.random() * positions.length)];
            let hands = Object.keys(db[pos].hands);
            let hand = hands[Math.floor(Math.random() * hands.length)];
            
            document.getElementById('pos').innerText = pos;
            document.getElementById('hand').innerText = hand;
            renderMatrix(pos);
        }

        function renderMatrix(pos) {
            const m = document.getElementById('matrix');
            m.innerHTML = '';
            for(let i=0; i<13; i++){
                for(let j=0; j<13; j++){
                    let hand = (i<j) ? cardValues[i]+cardValues[j]+"s" : (i>j) ? cardValues[j]+cardValues[i]+"o" : cardValues[i]+cardValues[j];
                    let div = document.createElement('div');
                    div.className = 'cell';
                    div.innerText = hand;
                    if(db[pos].hands[hand] === "raise") div.classList.add('raise');
                    m.appendChild(div);
                }
            }
        }

        function check(action) {
            let pos = document.getElementById('pos').innerText;
            let hand = document.getElementById('hand').innerText;
            let correct = (db[pos].hands[hand] || "fold").toLowerCase();
            document.getElementById('result').innerText = (action === correct) ? "✅ Acertou!" : "❌ Era " + correct;
            setTimeout(loadGame, 1000);
        }

        loadGame();
    </script>
</body>
</html>
