<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MTT GTO Quiz Trainer - Leitura JSON Externa</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 8px; text-align: center; width: 300px; }
        button { padding: 12px 20px; cursor: pointer; margin: 5px; }
        #debug { font-size: 12px; color: #fbbf24; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Quiz GTO</h1>
    <div class="box">
        <p>Stack: <span id="stack">--</span> | Pos: <span id="pos">--</span></p>
        <p>Mão: <strong id="hand">--</strong></p>
        <button onclick="check('raise')">Raise</button>
        <button onclick="check('fold')">Fold</button>
        <p id="result"></p>
        <p id="debug"></p>
    </div>

    <script>
        const allHands = ["AA","KK","QQ","JJ","TT","99","88","77","AKs","AQs","AJs","ATs","AKo","AQo","AJo","KQs","KJs","QJs","JTs"]; // Adicione o resto aqui
        let loadedData = {};
        let currentHand = "", currentPos = "", currentStack = "100BB";

        async function init() {
            try {
                // Tenta carregar o arquivo específico do stack
                const res = await fetch('./100bb.json'); 
                loadedData = await res.json();
                document.getElementById('debug').innerText = "JSON carregado com sucesso!";
            } catch(e) {
                document.getElementById('debug').innerText = "Erro ao carregar JSON: " + e.message;
            }
            next();
        }

        function next() {
            currentPos = ["UTG", "UTG1", "UTG2"][Math.floor(Math.random() * 3)];
            currentHand = allHands[Math.floor(Math.random() * allHands.length)];
            document.getElementById('pos').innerText = currentPos;
            document.getElementById('hand').innerText = currentHand;
        }

        function check(action) {
            // Acesso direto seguindo a estrutura do seu print: UTG -> hands -> Mão
            let posData = loadedData[currentPos];
            let correct = "fold"; // Default
            
            if (posData && posData.hands && posData.hands[currentHand]) {
                correct = posData.hands[currentHand].toLowerCase();
            } else {
                document.getElementById('debug').innerText = "Aviso: Mão não encontrada no JSON, assumindo Fold.";
            }

            if (action === correct) {
                document.getElementById('result').innerText = "✅ Correto! É " + correct;
            } else {
                document.getElementById('result').innerText = "❌ Errou. O correto era " + correct;
            }
            setTimeout(next, 1500);
        }

        init();
    </script>
</body>
</html>
