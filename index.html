<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MTT GTO Quiz Trainer</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 8px; text-align: center; width: 300px; }
        button { padding: 15px; cursor: pointer; margin: 5px; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <h1>Quiz GTO</h1>
    <div class="box">
        <p>Stack: <span id="stack">--</span> | Pos: <span id="pos">--</span></p>
        <p>Mão: <strong id="hand">--</strong></p>
        <button onclick="check('raise')">Raise</button>
        <button onclick="check('fold')">Fold</button>
        <p id="result"></p>
        <p id="debug" style="font-size:10px; color:yellow;"></p>
    </div>

    <script>
        const allHands = ["AA","KK","QQ","JJ","TT","99","88","77","66","55","44","33","22","AKs","AQs","AJs","ATs","A9s","A8s","A7s","A6s","A5s","A4s","A3s","A2s","AKo","AQo","AJo","ATo","A9o","A8o","A7o","A6o","A5o","A4o","A3o","A2o","KQs","KJs","KTs","K9s","K8s","K7s","K6s","K5s","K4s","K3s","K2s","KJo","KTo","K9o","K8o","K7o","K6o","K5o","K4o","K3o","K2o","QJs","QTs","Q9s","Q8s","Q7s","Q6s","Q5s","Q4s","Q3s","Q2s","QJo","QTo","Q9o","Q8o","Q7o","Q6o","Q5o","Q4o","Q3o","Q2o","JTs","J9s","J8s","J7s","J6s","J5s","J4s","J3s","J2s","JTo","J9o","J8o","J7o","J6o","J5o","J4o","J3o","J2o","T9s","T8s","T7s","T6s","T5s","T4s","T3s","T2s","T9o","T8o","T7o","T6o","T5o","T4o","T3o","T2o","98s","97s","96s","95s","94s","93s","92s","98o","97o","96o","95o","94o","93o","92o","87s","86s","85s","84s","83s","82s","87o","86o","85o","84o","83o","82o","76s","75s","74s","73s","72s","76o","75o","74o","73o","72o","65s","64s","63s","62s","65o","64o","63o","62o","54s","53s","52s","54o","53o","52o","43s","42s","43o","42o","32s","32o"];
        const stacks = ["100BB", "60BB", "30BB", "20BB"];
        const positions = ["UTG", "UTG1", "UTG2", "MP", "HJ", "CO", "BTN", "SB"];
        
        let db = {};
        let currentPos = "", currentHand = "", currentStack = "";

        async function init() {
            currentStack = stacks[Math.floor(Math.random() * stacks.length)];
            // Ajuste o nome do arquivo conforme seu repositório (ex: 100bb.json)
            let fileName = currentStack.toLowerCase() + ".json"; 
            
            try {
                const res = await fetch('./' + fileName);
                db = await res.json();
                document.getElementById('debug').innerText = "Carregado: " + fileName;
            } catch(e) { document.getElementById('debug').innerText = "Erro ao carregar: " + fileName; }
            next();
        }

        function next() {
            currentPos = positions[Math.floor(Math.random() * positions.length)];
            currentHand = allHands[Math.floor(Math.random() * allHands.length)];
            
            document.getElementById('stack').innerText = currentStack;
            document.getElementById('pos').innerText = currentPos;
            document.getElementById('hand').innerText = currentHand;
            document.getElementById('result').innerText = "";
        }

        function check(action) {
            // LÓGICA: Se a mão não estiver listada no JSON em .hands, o correto é FOLD
            let posData = db[currentPos] ? db[currentPos].hands : null;
            let correct = (posData && posData[currentHand]) ? posData[currentHand].toLowerCase() : "fold";
            
            if (action === correct) {
                document.getElementById('result').innerText = "✅ Correto! É " + correct;
            } else {
                document.getElementById('result').innerText = "❌ Errou. O correto era " + correct;
            }
            setTimeout(next, 1000);
        }

        init();
    </script>
</body>
</html>
