<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTT GTO Quiz Trainer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .matrix { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; width: 100%; max-width: 400px; margin-top: 20px; }
        .cell { background-color: #334155; padding: 5px 0; text-align: center; font-size: 9px; border-radius: 2px; color: #94a3b8; }
        .raise { background-color: #f97316 !important; color: white; font-weight: bold; }
        .fold { background-color: #1e293b !important; color: #475569; }
        button { padding: 15px 25px; font-size: 16px; margin: 5px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-raise { background: #f97316; color: white; }
        .btn-fold { background: #475569; color: white; }
        #debug { font-size: 9px; color: #fbbf24; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <p style="margin:0 0 10px 0; font-size: 0.9rem;">Stack: <span id="stack">--</span> | Pos: <span id="pos">--</span></p>
        <p style="margin:0; font-size: 1.2rem;">Mão:</p>
        <p id="hand" style="font-size: 2.5rem; margin: 10px 0; color: #4ade80; font-weight: bold;">--</p>
        <button class="btn-raise" onclick="check('raise')">Raise</button>
        <button class="btn-fold" onclick="check('fold')">Fold</button>
        <p id="result" style="height: 20px; font-weight: bold; margin-top: 15px;"></p>
        <p id="debug">Carregando...</p>
    </div>
    <div id="matrix" class="matrix"></div>

    <script>
        const cardValues = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
        const stacks = ["100bb", "60bb", "30bb", "20bb"];
        let db = {};
        let currentPos = "", currentHand = "", currentStack = "";

        async function loadStack() {
            currentStack = stacks[Math.floor(Math.random() * stacks.length)];
            try {
                const res = await fetch('./' + currentStack + '.json');
                db = await res.json();
                document.getElementById('debug').innerText = "Stack: " + currentStack.toUpperCase();
                next();
            } catch(e) { document.getElementById('debug').innerText = "Erro ao carregar " + currentStack; }
        }

        function next() {
            const positions = Object.keys(db);
            currentPos = positions[Math.floor(Math.random() * positions.length)];
            const hands = Object.keys(db[currentPos].hands);
            currentHand = hands[Math.floor(Math.random() * hands.length)];
            
            document.getElementById('stack').innerText = currentStack.toUpperCase();
            document.getElementById('pos').innerText = currentPos;
            document.getElementById('hand').innerText = currentHand;
            document.getElementById('result').innerText = "";
            renderMatrix();
        }

        function renderMatrix() {
            const m = document.getElementById('matrix');
            m.innerHTML = '';
            for(let i=0; i<13; i++){
                for(let j=0; j<13; j++){
                    let hand = (i<j) ? cardValues[i]+cardValues[j]+"s" : (i>j) ? cardValues[j]+cardValues[i]+"o" : cardValues[i]+cardValues[j];
                    let div = document.createElement('div');
                    div.className = 'cell';
                    div.innerText = hand;
                    
                    let action = (db[currentPos].hands[hand] || "fold").toLowerCase();
                    if(action === "raise") div.classList.add('raise');
                    else div.classList.add('fold');
                    
                    m.appendChild(div);
                }
            }
        }

        function check(action) {
            let correct = (db[currentPos].hands[currentHand] || "fold").toLowerCase();
            document.getElementById('result').innerText = (action === correct) ? "✅ Acertou!" : "❌ Errou: " + correct.toUpperCase();
            setTimeout(loadStack, 1000);
        }

        loadStack();
    </script>
</body>
</html>
