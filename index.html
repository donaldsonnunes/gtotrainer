<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quiz GTO</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 8px; text-align: center; width: 300px; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; margin: 5px; border-radius: 5px; border: none; }
        .btn-raise { background: #f97316; }
        .btn-fold { background: #4b5563; }
        #debug { font-size: 10px; color: yellow; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Quiz GTO</h1>
    <div class="box">
        <p>Stack: <span id="stack">--</span> | Pos: <span id="pos">--</span></p>
        <p>Mão: <strong id="hand" style="font-size: 24px;">--</strong></p>
        <button class="btn-raise" onclick="check('raise')">Raise</button>
        <button class="btn-fold" onclick="check('fold')">Fold</button>
        <p id="result"></p>
        <p id="debug"></p>
    </div>

    <script>
        const handsList = ["AA","KK","QQ","JJ","TT","99","88","AKs","AQs","AJs","ATs","AKo","AQo","AJo","KQs","KJs","QJs","JTs"]; 
        const stacks = ["100bb", "60bb", "30bb", "20bb"];
        const positions = ["UTG", "UTG1", "UTG2", "MP", "HJ", "CO", "BTN", "SB"];
        
        let db = {};
        let currentPos = "", currentHand = "", currentStack = "";

        async function loadStack(stackName) {
            try {
                const res = await fetch('./' + stackName + '.json');
                db = await res.json();
                document.getElementById('debug').innerText = "Carregado: " + stackName + ".json";
                currentStack = stackName;
                next(); // DISPARA O JOGO APÓS CARREGAR
            } catch(e) { 
                document.getElementById('debug').innerText = "Erro ao carregar " + stackName; 
            }
        }

        function next() {
            currentPos = positions[Math.floor(Math.random() * positions.length)];
            currentHand = handsList[Math.floor(Math.random() * handsList.length)];
            
            document.getElementById('stack').innerText = currentStack.toUpperCase();
            document.getElementById('pos').innerText = currentPos;
            document.getElementById('hand').innerText = currentHand;
            document.getElementById('result').innerText = "";
        }

        function check(action) {
            // Acesso seguro: db[pos].hands[hand]
            let posData = (db[currentPos] && db[currentPos].hands) ? db[currentPos].hands : null;
            let correct = (posData && posData[currentHand]) ? posData[currentHand].toLowerCase() : "fold";
            
            document.getElementById('result').innerText = (action === correct) ? "✅ Acertou!" : "❌ Errou. Era " + correct;
            setTimeout(next, 1200);
        }

        // Inicia com um stack aleatório
        loadStack(stacks[Math.floor(Math.random() * stacks.length)]);
    </script>
</body>
</html>
