<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTT GTO Quiz Trainer - 9-Max Clockwise</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h1 {
            color: #4ade80;
            margin-bottom: 5px;
            font-size: 1.6rem;
            text-align: center;
        }

        p.subtitle {
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
        }

        .app-layout {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .main-game-container {
            flex: 1;
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* MESA DE POKER OVAL */
        .poker-table-area {
            width: 100%;
            height: 280px;
            background-color: #0b1320;
            border-radius: 140px;
            border: 12px solid #334155;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            margin: 20px 0;
            box-sizing: border-box;
        }

        .felt-center {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .table-meta-info {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .cards-delivery {
            display: flex;
            gap: 8px;
        }

        .poker-card {
            width: 50px;
            height: 72px;
            background-color: #ffffff;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            box-sizing: border-box;
            font-weight: 900;
            font-size: 1.2rem;
            user-select: none;
        }
        
        .card-red { color: #dc2626; }
        .card-black { color: #1e293b; }
        .card-suit-bottom { align-self: flex-end; font-size: 1rem; }

        /* ASSENTOS JOGADORES */
        .player-seat {
            position: absolute;
            background-color: #1e293b;
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
            width: 78px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 2;
        }

        .hero-active-seat {
            border-color: #4ade80 !important;
            background-color: #064e3b !important;
            box-shadow: 0 0 12px #4ade80;
        }

        .seat-status { color: #94a3b8; font-size: 0.65rem; margin-top: 2px; }
        .hero-active-seat .seat-status { color: #4ade80; }

        /* COORDENADAS SENTIDO HORÁRIO CORRIGIDAS */
        .seat-0 { top: 30px; left: 15px; }     /* UTG */
        .seat-1 { top: -5px; left: 43%; }      /* UTG+1 */
        .seat-2 { top: 30px; right: 15px; }    /* UTG+2 */
        .seat-3 { top: 110px; right: -15px; }  /* MP */
        .seat-4 { bottom: 30px; right: 15px; } /* HJ */
        .seat-5 { bottom: -5px; left: 55%; }   /* CO */
        .seat-6 { bottom: -5px; left: 30%; }   /* BTN */
        .seat-7 { bottom: 30px; left: 15px; }  /* SB */
        .seat-8 { top: 110px; left: -15px; }   /* BB */

        /* BOTÃO DO DEALER (D) ANCORADO NO BTN */
        .dealer-button {
            position: absolute;
            width: 22px;
            height: 22px;
            background-color: #ffffff;
            color: #000000;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            border: 2px solid #000000;
            z-index: 10;
        }

        /* CONTROLES E PLACAR */
        .action-block {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            height: 46px;
            align-items: center;
        }

        .btn {
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            flex: 1;
            max-width: 110px;
        }
        .btn-raise { background-color: #f97316; }
        .btn-raise:hover { background-color: #ea580c; }
        .btn-allin { background-color: #b91c1c; }
        .btn-allin:hover { background-color: #991b1b; }
        .btn-limp { background-color: #3b82f6; }
        .btn-limp:hover { background-color: #2563eb; }
        .btn-fold { background-color: #4b5563; }
        .btn-fold:hover { background-color: #374151; }

        .btn-utility {
            background-color: #0284c7;
            color: white;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
            width: 100%;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .score-highlight { color: #4ade80; font-weight: bold; }

        .feedback-box {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-weight: bold;
            display: none;
            font-size: 0.9rem;
            line-height: 1.4;
            text-align: left;
        }
        .feedback-correct { background-color: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid #4ade80; }
        .feedback-wrong { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; }

        /* PAINEL DE RANGE DRAWER SLIDE */
        .matrix-panel {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .matrix-title { font-size: 1rem; color: #4ade80; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; }
        
        .matrix {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 2px;
            width: min(90vw, 360px);
            height: min(90vw, 360px);
        }

        .cell {
            background-color: #334155;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.55rem, 2.2vw, 0.65rem);
            font-weight: bold;
            color: #ffffff;
            user-select: none;
        }
        .cell-active-hand { outline: 2px solid #fbbf24; box-shadow: 0 0 10px #fbbf24; z-index: 10; }

        .btn-close-matrix {
            display: none;
            background-color: #ef4444;
            color: white;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            width: 100%;
        }

        @media (max-width: 768px) {
            .app-layout { flex-direction: column; align-items: center; }
            .matrix-panel {
                position: fixed;
                top: 0;
                right: -100%;
                width: 100vw;
                height: 100vh;
                z-index: 999;
                border-radius: 0;
                justify-content: center;
                transition: right 0.25s ease-in-out;
            }
            .matrix-panel.active { display: flex !important; right: 0; }
            .btn-close-matrix { display: block; }
        }

        @media (min-width: 769px) {
            .matrix-panel.active { display: flex !important; }
        }

        .summary-container { text-align: center; padding: 30px; background-color: #1e293b; border-radius: 12px; display: none; max-width: 500px; }
    </style>
</head>
