<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTT GTO Quiz Trainer</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; width: 95%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .matrix { display: grid; grid-template-columns: repeat(13, 1fr); gap: 1px; width: 95%; max-width: 400px; margin-top: 20px; }
        .cell { background-color: #334155; padding: 4px 1px; text-align: center; font-size: 9px; border-radius: 1px; color: #cbd5e1; }
        .raise { background-color: #f97316 !important; color: white; }
        button { padding: 15px 30px; font-size: 16px; margin: 5px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-raise { background: #f97316; color: white; }
        .btn-fold { background: #4b5563; color: white; }
    </style>
</head>
<body>
    <div class="box">
        <p>Stack: <span id="stack">--</span> | Pos: <span id="pos">--</span></p>
        <p>Mão: <strong id="hand" style="font-size: 1.8rem;">--</strong></p>
        <button class="btn-raise" onclick="check('raise')">Raise</button>
        <button class="btn-fold" onclick="check('fold')">Fold</button>
        <p id="result" style="height: 20px; font-weight: bold;"></p>
    </div>
    <div id="matrix" class="matrix"></div>

    <script>
        const cardValues = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
        const stacks = ["100bb", "60bb", "30bb", "20bb"];
        let db = {};
        let currentPos = "", currentHand = "", currentStack = "";

        async function loadStack() {
            currentStack = stacks[Math.floor(Math.random() * stacks.length)];
            try {
                const res = await fetch('./' + currentStack + '.json');
                db = await res.json();
                next();
            } catch(e) { console.error("Erro ao carregar JSON"); }
        }

        function next() {
            const positions = Object.keys(db);
            currentPos = positions[Math.floor(Math.random() * positions.length)];
            const hands = Object.keys(db[currentPos].hands);
            currentHand = hands[Math.floor(Math.random() * hands.length)];
            
            document.getElementById('stack').innerText = currentStack.toUpperCase();
            document.getElementById('pos').innerText = currentPos;
            document.getElementById('hand').innerText = currentHand;
            document.getElementById('result').innerText = "";
            renderMatrix();
        }

        function renderMatrix() {
            const m = document.getElementById('matrix');
            m.innerHTML = '';
            for(let i=0; i<13; i++){
                for(let j=0; j<13; j++){
                    let hand = (i<j) ? cardValues[i]+cardValues[j]+"s" : (i>j) ? cardValues[j]+cardValues[i]+"o" : cardValues[i]+cardValues[j];
                    let div = document.createElement('div');
                    div.className = 'cell';
                    div.innerText = hand;
                    if(db[currentPos].hands[hand] === "raise") div.classList.add('raise');
                    m.appendChild(div);
                }
            }
        }

        function check(action) {
            let correct = (db[currentPos].hands[currentHand] || "fold").toLowerCase();
            document.getElementById('result').innerText = (action === correct) ? "✅ Acertou!" : "❌ Errou: " + correct;
            setTimeout(loadStack, 1200); // Sorteia novo stack/mão após acertar
        }

        loadStack();
    </script>
</body>
</html>
